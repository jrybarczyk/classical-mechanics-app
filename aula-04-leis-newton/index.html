<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aplicação didática offline do Biocomplexity Lab para uma aula de Mecânica Clássica.">
<title>Mecânica Clássica · aplicação da aula</title>
<link rel="stylesheet" href="../_shared/dashboard.css">
</head>
<body>
<main class="app-shell">

  <header class="topbar">
    <div class="brand"><b>BIOCOMPLEXITY</b><small>LAB · IB/UNESP</small></div>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="appTitle"></h1>
      <p class="subtitle" id="appSubtitle"></p>
    </div>
    <div class="status" aria-live="polite">
      <span>Estação atual</span>
      <strong id="statusTitle"></strong>
      <small id="statusDetail"></small>
    </div>
  </header>

  <!-- As abas e os controles são construídos por ../_shared/dashboard.js
       a partir da declaração em scene.js. Não edite este arquivo por aula. -->
  <nav class="tabs" id="tabs" role="tablist" aria-label="Estações da aplicação"></nav>

  <section class="workspace">

    <aside class="controls" id="controlsPanel">
      <div class="panel-title">
        <h2>Parâmetros</h2>
        <button id="resetBtn" type="button">Reiniciar</button>
      </div>
      <div id="controlSections"></div>
    </aside>

    <section class="stage">
      <article class="canvas-panel">
        <div class="chart-heading">
          <div><h2 id="mainTitle"></h2><p id="mainSubtitle"></p></div>
          <div class="legend" id="legend"></div>
        </div>
        <canvas id="mainCanvas" aria-label="Visualização principal da estação"></canvas>
        <p class="caption" id="caption"></p>
      </article>
    </section>

    <aside class="analysis">
      <section class="predict"><span>Preveja antes de mover</span><p id="prediction"></p></section>
      <section><h2>Conta aberta</h2><div class="calculation" id="calculation"></div></section>
      <section><h2>Leituras</h2><dl id="metrics"></dl></section>
      <section><h2>Ideia física</h2><p id="conceptText"></p></section>
      <section><h2>Investigue</h2><ol id="prompts"></ol></section>
    </aside>

  </section>

  <footer>
    <span>Biocomplexity Lab · material didático</span>
    <span>Instituto de Biociências de Botucatu — UNESP · Depto. de Biofísica e Farmacologia · Prof. Assoc. José L. Rybarczyk-Filho</span>
  </footer>

</main>
<script src="../_shared/draw.js"></script>
<script src="physics.js"></script>
<script src="scene.js"></script>
<script src="../_shared/dashboard.js"></script>
</body>
</html>
